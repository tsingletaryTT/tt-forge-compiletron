version: '3.8'

services:
  compiletron:
    build:
      context: .
      dockerfile: Dockerfile
    image: tt-forge-compiletron:latest
    container_name: tt-forge-compiletron

    devices:
      - /dev/tenstorrent:/dev/tenstorrent

    volumes:
      # Persistent bestiary + run journals
      - compiletron-data:/app/data
      # HuggingFace model cache (avoids re-downloading between runs)
      - compiletron-hf-cache:/root/.cache/huggingface

    environment:
      - PYTHONUNBUFFERED=1

    stdin_open: true
    tty: true

    command: ["run", "--tui", "--chips", "4"]

volumes:
  compiletron-data:
    driver: local
  compiletron-hf-cache:
    driver: local
